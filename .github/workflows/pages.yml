name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/*/scripts/package-lock.json
      - name: Check the repository structure
        run: node scripts/check-repo.mjs
      - name: Check that the skills CLI discovers every skill
        run: |
          npx -y skills@latest add . --list > discovered.txt 2>&1 || { cat discovered.txt; exit 1; }
          cat discovered.txt
          for dir in skills/*/; do
            name=$(basename "$dir")
            grep -q "$name" discovered.txt || { echo "::error::the skills CLI did not discover $name"; exit 1; }
          done
      - name: Test optical-balance
        working-directory: skills/optical-balance/scripts
        run: npm ci && npm test
      - name: Build the sites
        run: |
          node sites/optical-balance/build-docs.mjs
          mkdir -p _site
          cp sites/index.html _site/index.html
          cp -R sites/optical-balance/dist _site/optical-balance
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
